<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#20262c;font:14px system-ui}main{max-width:1050px;margin:auto;padding:42px}h1{font:42px Georgia}.note{color:#69737c}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:28px}.card{background:white;border:1px solid #deddd8;border-radius:16px;padding:22px}table{width:100%;border-collapse:collapse}th,td{padding:13px;text-align:left;border-bottom:1px solid #eee}input{width:70px;padding:7px;border:1px solid #ccc;border-radius:7px}.summary strong{font-size:48px;display:block}.bar{height:10px;background:#e7e5df;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#293b4a}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:24px}}</style></head><body><main><small>ASSESSMENT SYSTEM · PUBLIC DEMO</small><h1>Assessment Tracker</h1><p class="note" id="learner">Synthetic portfolio data</p><div class="grid"><div class="card"><table><thead><tr><th>Assessment</th><th>Weight</th><th>Score %</th></tr></thead><tbody id="body"></tbody></table></div><div class="card summary"><span>Weighted outcome</span><strong id="total">0%</strong><div class="bar"><i id="fill"></i></div><p id="message"></p></div></div></main><script>let model;function render(){learner.textContent=model.learner.name+' · synthetic portfolio record';body.innerHTML=model.assessments.map((x,i)=>'<tr><td>'+x.name+'</td><td>'+Math.round(x.weight*100)+'%</td><td><input type="number" value="'+x.score+'" data-i="'+i+'"></td></tr>').join('');document.querySelectorAll('input').forEach(x=>x.oninput=e=>{model.assessments[e.target.dataset.i].score=+e.target.value;calc()});calc()}function calc(){let t=Math.round(model.assessments.reduce((s,x)=>s+x.score*x.weight,0));total.textContent=t+'%';fill.style.width=Math.max(0,Math.min(100,t))+'%';message.textContent=t>=70?'Strong overall performance':t>=60?'Secure overall performance':'Review priority areas'}google.script.run.withSuccessHandler(d=>{model=d;render()}).getAssessmentModel();</script></body></html>
